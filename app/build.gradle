plugins { id 'com.android.application' }

android {
    namespace 'cl.isanfurg.mg30pocket'
    compileSdk 36
    defaultConfig {
        applicationId 'cl.isanfurg.mg30pocket'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'cl.isanfurg.mg30pocket.SmokeRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
