plugins { id 'com.android.application' }

android {
    namespace 'cl.isanfurg.mg30pocket'
    compileSdk 36
    defaultConfig {
        applicationId 'cl.isanfurg.mg30pocket'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'cl.isanfurg.mg30pocket.SmokeRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { androidTest.assets.srcDirs = ['../test/fixtures'] }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
